[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-telecom"
version = "1.0.0"
description = "Uplift modeling for personalized marketing in telecommunications (MegaFon dataset)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abilkhay Askar" }, { name = "Kolzhabay Olzhas" }]
keywords = ["uplift modeling", "causal inference", "meta-learners", "qini", "marketing", "telecom"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3,<1.10",
    "scikit-uplift==0.5.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jupyter"]

[project.scripts]
uplift-telecom = "uplift_telecom.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["N803", "N806"]
